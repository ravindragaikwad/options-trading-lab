<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Options Trading Lab</title>
<style>
:root{--bg:#F2F5F8;--surface:#fff;--ink:#13202C;--ink-2:#506172;--line:#D3DBE3;--accent:#A85F00}
@media (prefers-color-scheme:dark){:root{--bg:#0D141B;--surface:#141D26;--ink:#E5EBF1;--ink-2:#9BADBD;--line:#283644;--accent:#F0A43A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:48px 16px}
main{max-width:640px;margin:0 auto}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
p{color:var(--ink-2);margin:0 0 24px}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;color:var(--ink);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
a.card b{display:block;margin-bottom:2px}
a.card span{color:var(--ink-2);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Options Trading Lab</h1>
<p>Learning pages and tools for day trading options. Educational only, not financial advice.</p>
<a class="card" href="playbook/"><b>Price Action Playbook</b><span>Interactive candlestick lessons, position sizing and a 12-question quiz.</span></a>
</main>
</body>
</html>
